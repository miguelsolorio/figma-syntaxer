  <!-- Main Application Script -->
  <script>
    /**
     * Core application state
     */
    const appState = {
      currentTheme: 'light-plus',
      currentLanguage: 'python',
      includeBg: false,
      autoDetect: true
    };

    /**
     * Helper to load external JavaScript
     */
    async function loadScript(src) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = src;
        script.onload = resolve;
        script.onerror = reject;
        document.head.appendChild(script);
      });
    }

    /**
     * Sanitize HTML to prevent XSS
     */
    function escapeHtml(unsafe) {
      return unsafe
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    /**
     * Load Shiki syntax highlighter
     */
    async function loadShiki() {
      await loadScript('https://cdn.jsdelivr.net/npm/shiki@0.14.7/dist/index.unpkg.iife.js');
      return window.shiki;
    }

    /**
     * Save user settings to plugin storage
     */
    function saveSettings() {
      const settings = {
        theme: appState.currentTheme,
        language: appState.currentLanguage,
        includeBg: appState.includeBg,
        autoDetect: appState.autoDetect
      };
      parent.postMessage({ pluginMessage: { type: 'saveSettings', settings } }, '*');
    }

    /**
     * Highlight code with current settings
     */
    async function highlightCode(code, language = appState.currentLanguage) {
      // Process language declaration if present
      if (code.trim().startsWith('$')) {
        code = code.substring(code.indexOf('\n') + 1);
      }

      // Update current language
      const previousLanguage = appState.currentLanguage;
      appState.currentLanguage = language || appState.currentLanguage;

      try {
        // Initialize syntax highlighter
        const shiki = await loadShiki();
        const highlighter = await shiki.getHighlighter({
          theme: document.getElementById('theme-dropdown').value,
          langs: [appState.currentLanguage]
        });

        // Apply syntax highlighting
        const highlightedCode = highlighter.codeToHtml(code, { lang: appState.currentLanguage });

        // Update UI
        const codeContainer = document.getElementById('code-container');
        codeContainer.innerHTML = highlightedCode;

        // Sync UI with current language
        document.getElementById('language-dropdown').value = appState.currentLanguage;

        // Show notification if language was auto-detected and changed
        if (appState.autoDetect && language && language !== previousLanguage && !code.trim().startsWith('$')) {
          showLanguageDetectionNotice(language, false);
        }
      } catch (error) {
        console.error('Error highlighting code:', error);
        displayError('Failed to highlight code. Please try again.');
      }
    }

    /**
     * Shows a notification when language is auto-detected or determined from layer name
     * Shows only one notification at a time
     * @param language The detected language
     * @param isFromLayerName Whether the language was detected from layer name
     */
    function showLanguageDetectionNotice(language, isFromLayerName = false) {
      const languageName = document.querySelector(`#language-dropdown option[value="${language}"]`)?.textContent || language;

      // Remove any existing notifications first
      const existingNotifications = document.querySelectorAll('.language-detection-notice');
      existingNotifications.forEach(notification => notification.remove());

      // Create notification element
      const notification = document.createElement('div');
      notification.className = 'language-detection-notice';

      // Different message based on detection method
      const message = isFromLayerName
        ? `Language set to <strong>${languageName}</strong> (#${language})`
        : `Detected <strong>${languageName}</strong> code`;

      notification.innerHTML = `
        <div class="w-full flex items-center bg-blue-100 border border-blue-300 text-blue-900 px-4 py-3 rounded-lg shadow-md text-sm gap-2">
          <svg xmlns="http://www.w3.org/2000/svg"
              class="w-5 h-5 stroke-blue-600"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
          <span>${message}</span>
        </div>
      `;

      // Add to the body instead of before code container
      document.body.appendChild(notification);

      // Auto-remove after 5 seconds
      setTimeout(() => {
        if (notification.parentNode) {
          notification.remove();
        }
      }, 5000);
    }

    /**
     * Display error message in code container
     */
    function displayError(message) {
      const codeContainer = document.getElementById('code-container');
      codeContainer.innerHTML = `<p class="empty-state">⚠️ ${message}</p>`;
    }

    /**
     * Change syntax highlighting theme
     */
    async function changeTheme(theme) {
      try {
        const shiki = await loadShiki();
        const highlighter = await shiki.getHighlighter({
          theme: theme,
          langs: [appState.currentLanguage]
        });

        const codeElement = document.querySelector('#code-container pre code');
        if (codeElement) {
          const code = codeElement.textContent;
          const highlightedCode = highlighter.codeToHtml(code, { lang: appState.currentLanguage });
          document.getElementById('code-container').innerHTML = highlightedCode;

          // Notify plugin of theme change
          parent.postMessage({ pluginMessage: { type: 'themeChanged', theme } }, '*');
        }

        appState.currentTheme = theme;
        saveSettings();
      } catch (error) {
        console.error('Error changing theme:', error);
      }
    }

    /**
     * Change language for syntax highlighting
     */
    function changeLanguage(language) {
      appState.currentLanguage = language;

      const codeElement = document.querySelector('#code-container pre code');
      if (codeElement) {
        const code = codeElement.textContent;
        highlightCode(code, language);
      }

      saveSettings();
    }

    /**
     * Toggle background setting
     */
    function toggleBackground(include) {
      appState.includeBg = include;
      saveSettings();
    }

    /**
     * Toggle auto-detect setting
     */
    function toggleAutoDetect(enabled) {
      appState.autoDetect = enabled;

      // Get current code
      const codeElement = document.querySelector('#code-container pre code');
      const code = codeElement ? codeElement.textContent : '';

      // Toggle language dropdown disabled state
      const languageDropdown = document.getElementById('language-dropdown');
      languageDropdown.disabled = enabled;
      // set title attribute to show tooltip
      languageDropdown.title = enabled ? 'Disabled when auto-detect is enabled' : '';

      // Add visual feedback on disabled state
      if (enabled) {
        languageDropdown.classList.add('opacity-40', 'cursor-not-allowed');
      } else {
        languageDropdown.classList.remove('opacity-40', 'cursor-not-allowed');
      }

      // Immediately notify the plugin of this change, sending the current code for re-detection
      parent.postMessage({
        pluginMessage: {
          type: 'toggleAutoDetect',
          autoDetect: enabled,
          content: code
        }
      }, '*');

      saveSettings();
    }

    /**
     * Extract color data from syntax-highlighted code
     */
    function extractColorData(element, isFirstLine, hasLanguageDeclaration) {
      const colorData = [];

      function processNode(node, isFirst) {
        if (node.nodeType === Node.TEXT_NODE) {
          // Get the computed color style from parent element
          const parentStyle = window.getComputedStyle(node.parentElement);

          // Skip language declaration line if needed
          if (!isFirst || !hasLanguageDeclaration) {
            colorData.push({
              text: node.textContent,
              color: parentStyle.color
            });
          }
        } else if (node.nodeType === Node.ELEMENT_NODE) {
          // Process child nodes recursively
          let isFirstChild = isFirst;
          for (let child of node.childNodes) {
            processNode(child, isFirstChild);
            isFirstChild = false;
          }
        }
      }

      processNode(element, isFirstLine);
      return colorData;
    }

    /**
     * Apply syntax highlighting to Figma text layers
     */
    function applyColors() {
      const codeElement = document.querySelector('#code-container pre');
      if (!codeElement) {
        return;
      }

      // Get UI state
      const includeBg = document.getElementById('include-bg').checked;
      const autoDetect = document.getElementById('auto-detect').checked;
      const backgroundColor = includeBg ? window.getComputedStyle(codeElement).backgroundColor : null;
      const hasLanguageDeclaration = codeElement.textContent.trim().startsWith('$');

      // Extract color data from highlighted code
      const colorData = extractColorData(codeElement, true, hasLanguageDeclaration);

      // Send data to plugin
      parent.postMessage({
        pluginMessage: {
          type: 'applyDetailedColors',
          colorData,
          backgroundColor,
          hasLanguageDeclaration,
          includeBg,
          autoDetect
        }
      }, '*');
    }

    /**
     * Process multiple nodes for auto syntax mode
     */
    async function processNodes(nodes, settings) {
      // Apply settings
      updateUIFromSettings(settings);

      // Process each node
      const processedNodes = [];
      for (const node of nodes) {
        // Highlight code with appropriate language
        await highlightCode(node.content, node.language);

        // Extract color data
        const codeElement = document.querySelector('#code-container pre');
        if (codeElement) {
          const hasLanguageDeclaration = node.content.trim().startsWith('$');
          const backgroundColor = settings.includeBg ?
            window.getComputedStyle(codeElement).backgroundColor : null;

          const colorData = extractColorData(codeElement, true, hasLanguageDeclaration);
          processedNodes.push({ colorData, hasLanguageDeclaration });
        }
      }

      // Send processed data back to plugin
      parent.postMessage({
        pluginMessage: {
          type: 'processedNodes',
          processedNodes,
          backgroundColor: settings.includeBg ?
            window.getComputedStyle(document.querySelector('#code-container pre')).backgroundColor : null,
          includeBg: settings.includeBg
        }
      }, '*');
    }

    /**
     * Check if the current layer has a language defined in its name
     */
    function hasLanguageInLayerName(layerName) {
      return layerName && layerName.startsWith('#');
    }

    /**
     * Update UI controls from settings object
     */
    function updateUIFromSettings(settings) {
      if (!settings) return;

      appState.currentTheme = settings.theme;
      appState.currentLanguage = settings.language;
      appState.includeBg = settings.includeBg;
      appState.autoDetect = settings.autoDetect !== undefined ? settings.autoDetect : true;

      // Update UI elements
      const themeDropdown = document.getElementById('theme-dropdown');
      const languageDropdown = document.getElementById('language-dropdown');
      const includeBgCheckbox = document.getElementById('include-bg');
      const autoDetectCheckbox = document.getElementById('auto-detect');

      themeDropdown.value = settings.theme;
      languageDropdown.value = settings.language;
      includeBgCheckbox.checked = settings.includeBg;
      autoDetectCheckbox.checked = appState.autoDetect;

      // Set language dropdown disabled state based on auto-detect setting
      languageDropdown.disabled = appState.autoDetect;

      // Update visual styles for disabled state
      if (appState.autoDetect) {
        languageDropdown.classList.add('opacity-40', 'cursor-not-allowed');
      } else {
        languageDropdown.classList.remove('opacity-40', 'cursor-not-allowed');
      }
    }

    /**
     * Handle messages from the plugin
     */
    async function handlePluginMessage(event) {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      switch (msg.type) {
        case 'process-nodes':
          // Process multiple nodes (auto mode)
          await processNodes(msg.nodes, msg.settings);
          break;

        case 'code':
          // Display code from selection
          if (msg.settings) {
            updateUIFromSettings(msg.settings);
          } else if (msg.autoDetect !== undefined) {
            // Update just the autoDetect setting if provided
            appState.autoDetect = msg.autoDetect;
            document.getElementById('auto-detect').checked = msg.autoDetect;
          }

          // Get language dropdown element
          const languageDropdown = document.getElementById('language-dropdown');

          // Update language dropdown to match the detected/preferred language
          // This ensures the UI language selector matches what was detected from #lang
          if (msg.language) {
            languageDropdown.value = msg.language;
            appState.currentLanguage = msg.language;
          }

          // If language was determined from layer name, disable language selector regardless of auto-detect
          if (msg.isLanguageFromLayerName) {
            languageDropdown.disabled = true;
            languageDropdown.classList.add('opacity-40', 'cursor-not-allowed');

            // Show a notification that language is determined by layer name
            // showLanguageDetectionNotice(msg.language, true);
          } else {
            // Normal behavior - only disable if auto-detect is on
            languageDropdown.disabled = appState.autoDetect;
            if (!appState.autoDetect) {
              languageDropdown.classList.remove('opacity-40', 'cursor-not-allowed');
            }
          }

          await highlightCode(msg.content, msg.language);

          if (msg.autoRun) {
            applyColors();
          }
          break;

        case 'no-selection':
          // Show empty state
          document.getElementById('code-container').innerHTML =
            '<p class="empty-state">ℹ️ Please select at least one text layer</p>';
          break;

        case 'loadSettings':
          // Load saved settings
          if (msg.settings) {
            updateUIFromSettings(msg.settings);
            changeTheme(msg.settings.theme);
          }
          break;

        case 'detectedLanguage':
          // A language was detected based on current content
          if (msg.language && msg.content) {
            // Update language dropdown to match detected language
            document.getElementById('language-dropdown').value = msg.language;
            appState.currentLanguage = msg.language;

            // Apply highlighting with the detected language
            await highlightCode(msg.content, msg.language);
          }
          break;

        case 'init':
          // Plugin initialization
          break;
      }
    }

    /**
     * Initialize the plugin UI
     */
    async function initPlugin() {
      try {
        // Load Shiki
        await loadShiki();

        // Set up event listeners
        document.getElementById('theme-dropdown').addEventListener('change', e =>
          changeTheme(e.target.value));

        document.getElementById('language-dropdown').addEventListener('change', e =>
          changeLanguage(e.target.value));

        document.getElementById('apply-button').addEventListener('click',
          applyColors);

        document.getElementById('include-bg').addEventListener('change', e =>
          toggleBackground(e.target.checked));

        document.getElementById('auto-detect').addEventListener('change', e =>
          toggleAutoDetect(e.target.checked));

        // Register message handler
        window.onmessage = handlePluginMessage;

        // Load settings from plugin
        parent.postMessage({ pluginMessage: { type: 'init' } }, '*');
      } catch (error) {
        console.error('Failed to initialize plugin:', error);
        displayError('Failed to load syntax highlighter. Please try reloading.');
      }
    }

    // Initialize plugin when document is ready
    window.addEventListener('DOMContentLoaded', initPlugin);
  </script>
</body>
